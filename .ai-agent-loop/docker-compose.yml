services:
  # ---- Bare repo initializer (runs once, then exits) ----
  upstream:
    image: alpine/git:latest
    volumes:
      - upstream-repo:/upstream
      - ./init-upstream.sh:/init-upstream.sh:ro
      - ${HOST_PROJECT_DIR:-..}:/host-repo:ro
    environment:
      - DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}
      - AGENT_UID=${AGENT_UID:-1001}
      - AGENT_GID=${AGENT_GID:-1001}
    entrypoint: ["/bin/sh", "/init-upstream.sh"]

  # ---- Claude Code agent (scalable) ----
  agent:
    build:
      context: ./agent
    env_file: .env
    environment:
      - DEFAULT_BRANCH=${DEFAULT_BRANCH:-main}
    volumes:
      - upstream-repo:/upstream
      - ./AGENT_PROMPT.md:/config/AGENT_PROMPT.md:ro
      - ./agent-sessions/projects:/home/agent/.claude/projects
    depends_on:
      upstream:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
    stop_grace_period: 5m
    stop_signal: SIGTERM
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Session log viewer ----
  viewer:
    image: node:24-slim
    command: >-
      npx @kimuson/claude-code-viewer@latest
      --hostname 0.0.0.0
      --port 3400
      --claude-dir /claude-data
    ports:
      - "${VIEWER_PORT:-3400}:3400"
    volumes:
      - ./agent-sessions:/claude-data:ro
    restart: unless-stopped

volumes:
  upstream-repo:
