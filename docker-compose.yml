services:
  # ---- Bare repo initializer (runs once, then exits) ----
  upstream:
    image: alpine/git:latest
    volumes:
      - upstream-repo:/upstream
      - ./init-upstream.sh:/init-upstream.sh:ro
      - ./CLAUDE.md:/config/CLAUDE.md:ro
    entrypoint: ["/bin/sh", "/init-upstream.sh"]

  # ---- Claude Code agent (scalable) ----
  agent:
    build:
      context: ./agent
    env_file: .env
    volumes:
      - upstream-repo:/upstream
      - ./AGENT_PROMPT.md:/config/AGENT_PROMPT.md:ro
    depends_on:
      upstream:
        condition: service_completed_successfully
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G
    stop_grace_period: 5m
    stop_signal: SIGTERM
    restart: unless-stopped

volumes:
  upstream-repo:
